image:
  tag: "{{ .Chart.AppVersion }}"

adminUser: admin
adminPassword: admin

persistence:
  enabled: true
  storageClassName: standard
  annotations:
    volumeType: local
  inMemory:
    enabled: false
    size: 10Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Mimir
      type: prometheus
      access: proxy
      url: http://mimir:9009/prometheus
      jsonData:
        prometheusType: Mimir
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-headless:3100
      isDefault: false
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo-headless:3200
      isDefault: false
