minio:
  enabled: false

kafka:
  enabled: true

mimir:
  structuredConfig:
    multitenancy_enabled: false
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 9009
    blocks_storage:
      backend: filesystem

alertmanager:
  persistentVolume:
    enabled: true
    storageClass: standard
    size: 10Gi
  replicas: 1
  statefulSet:
    enabled: true
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

