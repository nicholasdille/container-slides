defaults:
  extraVolumes:
  - name: data
    hostPath: 
      path: /data/loki
      type: DirectoryOrCreate
  extraVolumeMounts:
  - name: data
    mountPath: /data

loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    filesystem:
      chunks_directory: /data/chunks
      rules_directory: /data/rules

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0