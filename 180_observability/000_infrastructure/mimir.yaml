---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir
  namespace: monitoring
data:
  mimir.yaml: |
    target: all
    server:
      http_listen_port: 8080
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/tsdb
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9090
      protocol: TCP
      name: http-metrics
      targetPort: http-metrics
    - port: 9095
      protocol: TCP
      name: grpc
      targetPort: grpc
  selector:
    app: mimir
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: monitoring
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      volumes:
      - name: config
        configMap:
          name: mimir
      - name: data
        hostPath:
          path: /data/mimir
          type: DirectoryOrCreate
      containers:
      - name: mimir
        image: grafana/mimir:3.2.5
        args:
        - -target=all
        - -config.file=/etc/mimir/mimir.yaml
        ports:
        - name: http-metrics
          containerPort: 9090
          protocol: TCP
        - name: grpc
          containerPort: 9095
          protocol: TCP
        - name: memberlist
          containerPort: 7946
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/mimir
        - name: data
          mountPath: /data
