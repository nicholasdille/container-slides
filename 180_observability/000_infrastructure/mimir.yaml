---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir
  namespace: monitoring
data:
  mimir.yaml: |
    target: all
    multitenancy_enabled: false
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 9009
    blocks_storage:
      backend: filesystem
    limits:
      max_label_name_length: 1024
      max_label_value_length: 2048
      max_label_names_per_series: 30
    memberlist:
      bind_addr:
      - 127.0.0.1
    ingester:
      ring:
        replication_factor: 1
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 9009
    protocol: TCP
    name: http-metrics
    targetPort: http-metrics
  - port: 9095
    protocol: TCP
    name: grpc
    targetPort: grpc
  selector:
    app: mimir
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: monitoring
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi
  template:
    metadata:
      labels:
        app: mimir
    spec:
      volumes:
      - name: config
        configMap:
          name: mimir
      containers:
      - name: mimir
        image: grafana/mimir:3.2.5
        args:
        - -target=all
        - -config.file=/etc/mimir/mimir.yaml
        ports:
        - name: http-metrics
          containerPort: 9009
          protocol: TCP
        - name: grpc
          containerPort: 9095
          protocol: TCP
        - name: memberlist
          containerPort: 7946
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/mimir
        - name: data
          mountPath: /data
