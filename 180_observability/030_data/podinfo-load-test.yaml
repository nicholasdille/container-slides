---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo-load-test
  namespace: default
data:
  test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      vus: 10,
      duration: '8760h',
    };

    const baseUrl = __ENV.BASE_URL || 'http://frontend-podinfo.default:9898';

    // Status code distribution:
    // 200 - 80%, 302 - 10%, 304 - 2%, 401 - 1%, 403 - 1%, 404 - 3%, 429 - 2%, 500 - 1%
    const codes = [
      { code: 200, weight: 0.80 },
      { code: 302, weight: 0.10 },
      { code: 304, weight: 0.02 },
      { code: 401, weight: 0.01 },
      { code: 403, weight: 0.01 },
      { code: 404, weight: 0.03 },
      { code: 429, weight: 0.02 },
      { code: 500, weight: 0.01 },
    ];

    function nextCode() {
      const r = Math.random();
      let sum = 0;
      for (const c of codes) {
        sum += c.weight;
        if (r < sum) {
          return c.code;
        }
      }
      return codes[codes.length - 1].code;
    }

    export default function () {
      sleep(2 + Math.random() * 3);
      http.get(`${baseUrl}/status/${nextCode()}`);
    }

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: podinfo-load-test
  namespace: default
spec:
  parallelism: 1
  script:
    configMapName: podinfo-load-test
    configMapFile: test.js
  arguments: --out=experimental-prometheus-rw
  runner:
    env:
    - name: BASE_URL
      value: http://frontend-podinfo.default:9898
    - name: K6_PROMETHEUS_RW_SERVER_URL
      value: http://mimir-gateway.monitoring/api/v1/push
    - name: K6_PROMETHEUS_RW_HTTP_HEADERS
      value: X-Scope-OrgID:anonymous
    - name: K6_PROMETHEUS_RW_LABELS
      value: job=podinfo-load-test
