minio:
  enabled: false

kafka:
  enabled: true

metaMonitoring:
  serviceMonitor:
    enabled: true

mimir:
  structuredConfig:
    multitenancy_enabled: false
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 9009
    blocks_storage:
      backend: filesystem
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    ruler:
      rule_path: /data/eval
      alertmanager_url: http://alertmanager:9093

alertmanager:
  enabled: false

compactor:
  persistentVolume:
    enabled: true
    storageClass: standard
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 1Gi

